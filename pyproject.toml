[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidatasetkit"
version = "0.1.0a1"
description = "Prove what happened between your data and your model: profiling, quality and leakage checks, capability-driven preprocessing, and an audit artifact published with a verifiable manifest."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mohamed" }]
keywords = [
    "data-quality",
    "data-audit",
    "ml-safety",
    "provenance",
    "data-lineage",
    "profiling",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

# Apache-2.0, chosen by the repository owner. The SPDX-string form (PEP 639)
# rather than the TOML table setuptools has scheduled for removal in 2027.
license = "Apache-2.0"
license-files = ["LICENSE"]

# The floors are the oldest versions the full suite has passed on, together, on
# Python 3.11 -- constraints/minimum.txt pins exactly these and CI runs it -- not
# the oldest versions that might work. docs/supported-environments.md gives the
# reason for each; tests/unit/test_dependency_contract.py keeps the two in step.
# scikit-learn 1.6.1 is the first version on which every declared capability is
# true (ExtraTrees refuses NaN on 1.5.2). There are no upper bounds.
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.1.4",
    "scipy>=1.11.4",
    "scikit-learn>=1.6.1",
]

# Optional model backends. These are never required: a model that needs one is
# always visible in the catalog, but raises MissingDependencyError on create().
[project.optional-dependencies]
boosting = ["xgboost>=2.0.0", "lightgbm>=4.0.0", "catboost>=1.2"]
viz = ["matplotlib>=3.9.0"]
# Everything CONTRIBUTING.md and scripts/release_smoke_test.sh ask a contributor
# to run. Without build and twine the documented release gate cannot execute.
dev = ["pytest>=8.0.0", "build>=1.0", "twine>=5.0"]
all = ["aidatasetkit[boosting,viz,dev]"]

[project.scripts]
aidatasetkit = "aidatasetkit.cli.main:main"

[tool.setuptools.packages.find]
include = ["aidatasetkit*"]

# PEP 561: without this marker a type checker ignores every annotation in the
# installed package, and the "Typing :: Typed" classifier would be a claim the
# distribution does not honour.
[tool.setuptools.package-data]
aidatasetkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "optional_backend: requires an optional model backend to be installed",
]
