[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidatasetkit"
version = "0.1.0.dev0"
description = "A toolkit that takes tabular data from raw frame to model-ready: profiling, statistics, quality checks, capability-driven preprocessing, and model comparison."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohamed" }]
keywords = ["data-analysis", "statistics", "profiling", "data-quality", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

# Optional model backends. These are never required: a model that needs one is
# always visible in the catalog, but raises MissingDependencyError on create().
[project.optional-dependencies]
boosting = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]
dev = ["pytest>=8.0"]
all = ["aidatasetkit[boosting,dev]"]

[tool.setuptools.packages.find]
include = ["aidatasetkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "optional_backend: requires an optional model backend to be installed",
]
