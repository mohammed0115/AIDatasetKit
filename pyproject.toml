[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidatasetkit"
version = "0.1.0a1"
description = "Prove what happened between your data and your model: profiling, quality and leakage checks, capability-driven preprocessing, and a signed-off audit artifact."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mohamed" }]
keywords = [
    "data-quality",
    "data-audit",
    "ml-safety",
    "provenance",
    "data-lineage",
    "profiling",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

# The project has declared MIT since its first commit. That declaration is left
# exactly as it was found: changing it would be a legal decision, and so would
# removing it. It is not yet backed by a LICENSE file, which is recorded as a
# release blocker in README.md for the owner to resolve before publication.
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

# Optional model backends. These are never required: a model that needs one is
# always visible in the catalog, but raises MissingDependencyError on create().
[project.optional-dependencies]
boosting = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]
viz = ["matplotlib>=3.9"]
# Everything CONTRIBUTING.md and scripts/release_smoke_test.sh ask a contributor
# to run. Without build and twine the documented release gate cannot execute.
dev = ["pytest>=8.0", "build>=1.0", "twine>=5.0"]
all = ["aidatasetkit[boosting,viz,dev]"]

[project.scripts]
aidatasetkit = "aidatasetkit.cli.main:main"

[tool.setuptools.packages.find]
include = ["aidatasetkit*"]

# PEP 561: without this marker a type checker ignores every annotation in the
# installed package, and the "Typing :: Typed" classifier would be a claim the
# distribution does not honour.
[tool.setuptools.package-data]
aidatasetkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "optional_backend: requires an optional model backend to be installed",
]
